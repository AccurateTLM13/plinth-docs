title: Plinth Docs
brand: Lemonteed Themes
support_email: "support@themes.lemonteed.com"   # forwarded to our inbox by Cloudflare Email Routing
description: Documentation and support for Plinth, a bold, fast Shopify theme.
# Served at https://themes.lemonteed.com (custom domain, see the CNAME file).
# Site root (/) is the Lemonteed Themes landing page; Plinth's docs live under /plinth/
# so future themes can sit beside it (/<theme>/). Old /<page>/ paths redirect to /plinth/<page>/.
url: https://themes.lemonteed.com
baseurl: ""
lang: en
theme_version: "1.1.7"
github_repo: AccurateTLM13/plinth-docs

# ---------------------------------------------------------------------------
# SUPPORT FORM — the values you need to change to turn the form on.
#
# PLACEHOLDER: `endpoint` is intentionally empty, so the support page shows
# a notice and points people to GitHub issues instead.
#
# Backend: our own Cloudflare Worker (private repo AccurateTLM13/plinth-support-worker).
# To activate: deploy the Worker, paste its /submit URL below plus the
# Turnstile site key (public, safe to commit), commit, and GitHub Pages
# rebuilds the site in about a minute. See README.md.
# ---------------------------------------------------------------------------
support_form:
  endpoint: ""                 # e.g. "https://plinth-support.<your-subdomain>.workers.dev/submit"
  turnstile_site_key: ""       # Cloudflare Turnstile site key (public). Empty = no widget.
  honeypot_field: "website"    # must match HONEYPOT_FIELD in the Worker's wrangler.jsonc
  max_files: 3                 # these three must match the Worker's MAX_FILES / MAX_FILE_MB / MAX_TOTAL_MB
  max_file_mb: 10
  max_total_mb: 25
  hidden_fields:               # sent with every request
    theme: "Plinth"            # theme name, as the Theme Store asks for

plugins:
  - jekyll-redirect-from   # supported on GitHub Pages; makes the old-path redirect stubs

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
  hard_wrap: false
  syntax_highlighter_opts:
    disable: true

exclude:
  - README.md
  - tools/
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .github/
