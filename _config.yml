title: Plinth Docs
description: Documentation and support for Plinth, a bold, fast Shopify theme.
url: https://accuratetlm13.github.io
baseurl: /plinth-docs
lang: en
theme_version: "1.1.7"
github_repo: AccurateTLM13/plinth-docs

# ---------------------------------------------------------------------------
# SUPPORT FORM — the only value you need to change to turn the form on.
#
# PLACEHOLDER: `endpoint` is intentionally empty, so the support page shows
# a notice and points people to GitHub issues instead.
#
# Service: FormBackend (https://www.formbackend.com), Simple plan or higher.
# The free plan has no file uploads or auto-responses, which the Theme Store
# requires. To activate: paste the form's endpoint URL below, commit, and
# GitHub Pages rebuilds the site in about a minute. See README.md.
# ---------------------------------------------------------------------------
support_form:
  endpoint: ""                        # e.g. "https://www.formbackend.com/f/abc123def456"
  honeypot_field: "formbackend_nono"  # FormBackend's default spam-trap field name
  max_files: 3                        # attachments per request (checked in the browser)
  max_file_mb: 10                     # size limit per file, in MB (checked in the browser)
  hidden_fields:                      # sent with every request
    _redirect: "https://accuratetlm13.github.io/plinth-docs/support/thanks/"  # no-JS confirmation page
    theme: "Plinth"                   # theme name, as the Theme Store asks for

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
  hard_wrap: false
  syntax_highlighter_opts:
    disable: true

exclude:
  - README.md
  - tools/
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .github/
